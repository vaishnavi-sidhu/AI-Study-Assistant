<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Study Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 650px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px 25px;
            color: white;
            text-align: center;
        }

        .header h1 { font-size: 22px; margin-bottom: 4px; }
        .header p { font-size: 13px; opacity: 0.85; }

        #messages {
            height: 420px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9ff;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .welcome {
            background: #ede9fe;
            border-left: 4px solid #764ba2;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 14px;
            color: #4c1d95;
        }

        .user-msg {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 15px;
            border-radius: 18px 18px 4px 18px;
            align-self: flex-end;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.5;
        }

        .bot-msg {
            background: white;
            color: #333;
            padding: 12px 15px;
            border-radius: 18px 18px 18px 4px;
            align-self: flex-start;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 1px solid #e8e8f0;
        }

        .typing {
            background: white;
            padding: 12px 15px;
            border-radius: 18px 18px 18px 4px;
            align-self: flex-start;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-size: 13px;
            color: #888;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #eee;
        }

        #user-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 25px;
            border: 2px solid #e0e0f0;
            font-size: 14px;
            outline: none;
            transition: border 0.2s;
        }

        #user-input:focus { border-color: #667eea; }

        button {
            padding: 12px 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 14px;
            background: white;
        }

        .chip {
            background: #ede9fe;
            color: #5b21b6;
            border: none;
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            background: none;
            border: 1.5px solid #c4b5fd;
        }

        .chip:hover { background: #ede9fe; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 AI Study Assistant</h1>
            <p>Koi bhi concept pucho — simple language mein samjhaunga!</p>
        </div>

        <div id="messages">
            <div class="welcome">
                👋 Hey! Main tera Study Assistant hoon.<br>
                Koi bhi topic type karo — main easy examples ke saath samjhaunga! 🎯
            </div>
        </div>

        <div class="suggestions">
            <button class="chip" onclick="quickAsk('Photosynthesis kya hoti hai?')">🌿 Photosynthesis</button>
            <button class="chip" onclick="quickAsk('Newton ke laws kya hain?')">🍎 Newton Laws</button>
            <button class="chip" onclick="quickAsk('Democracy kya hoti hai?')">🗳️ Democracy</button>
            <button class="chip" onclick="quickAsk('Pythagoras theorem explain karo')">📐 Pythagoras</button>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Topic ya question likho..." />
            <button onclick="sendMessage()">Send ➤</button>
        </div>
    </div>

    <script>
        function quickAsk(text) {
            document.getElementById("user-input").value = text;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const messages = document.getElementById("messages");
            const userText = input.value.trim();
            if (!userText) return;

            messages.innerHTML += `<div class="user-msg">${userText}</div>`;
            input.value = "";

            const typing = document.createElement("div");
            typing.className = "typing";
            typing.id = "typing";
            typing.textContent = "⏳ Soch raha hoon...";
            messages.appendChild(typing);
            messages.scrollTop = messages.scrollHeight;

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: userText })
            });

            const data = await response.json();
            document.getElementById("typing").remove();

            messages.innerHTML += `<div class="bot-msg">📖 ${data.reply}</div>`;
            messages.scrollTop = messages.scrollHeight;
        }

        document.getElementById("user-input").addEventListener("keypress", function(e) {
            if (e.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
